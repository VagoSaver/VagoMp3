name: Build VagoMp3 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate VagoMp3 Android project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR=""

          # Preferred layout: the Android project is the repository root.
          if [[ -f "settings.gradle.kts" && -f "app/build.gradle.kts" ]]; then
            PROJECT_DIR="$PWD"
          else
            # Also support the user's ZIP-based GitHub layout.
            ZIP_FILE="$(find . -maxdepth 3 -type f \\
              \( -name 'VagoMp3_Android_Project.zip' -o -name 'VagoMp3*.zip' \) \\
              -print -quit)"

            if [[ -n "$ZIP_FILE" ]]; then
              echo "VagoMp3 ZIP tapıldı: $ZIP_FILE"
              rm -rf extracted-vagomp3
              mkdir -p extracted-vagomp3
              unzip -q "$ZIP_FILE" -d extracted-vagomp3

              SETTINGS_FILE="$(find extracted-vagomp3 -type f -name 'settings.gradle.kts' -print -quit)"
              if [[ -z "$SETTINGS_FILE" ]]; then
                echo "ERROR: ZIP daxilində settings.gradle.kts tapılmadı."
                exit 1
              fi
              PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: VagoMp3 Android layihəsi tapılmadı."
            echo "Repository faylları:"
            find . -maxdepth 5 -type f | sort | head -300
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "VagoMp3 project: $PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          grep -q 'com.vagomp3.app' app/build.gradle.kts
          grep -q 'applicationId = "com.vagomp3.app"' app/build.gradle.kts

          echo "Android project structure OK."
          echo "Package: com.vagomp3.app"

      - name: Build Debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Build Release APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apk-output
          mkdir -p apk-output

          DEBUG_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' -print -quit)"

          [[ -n "$DEBUG_APK" ]] || { echo "ERROR: Debug APK yaradılmadı."; exit 1; }
          [[ -n "$RELEASE_APK" ]] || { echo "ERROR: Release APK yaradılmadı."; exit 1; }

          cp "$DEBUG_APK" apk-output/VagoMp3-debug.apk
          cp "$RELEASE_APK" apk-output/VagoMp3-release.apk

          echo "Generated APKs:"
          ls -lh apk-output/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VagoMp3-APKs
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
